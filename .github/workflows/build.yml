
name: Build Pocket Realms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Check source
        run: |
          test -f src/main/java/com/doodly141/pocketrealms/PocketRealms.java
          test -f src/main/resources/META-INF/neoforge.mods.toml

      - name: Compile mod
        run: gradle --no-daemon clean build

      - name: Verify actual mod JAR
        run: |
          JAR=$(find build/libs -name '*.jar' -type f | head -1)
          test -n "$JAR"
          test "$(stat -c%s "$JAR")" -gt 5000
          jar tf "$JAR" | grep 'PocketRealms.class'
          
      - uses: actions/upload-artifact@v4
        with:
          name: PocketRealms-Mod
          path: build/libs/*.jar
          if-no-files-found: error
